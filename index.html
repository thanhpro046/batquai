
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>La Kinh Bát Quái 3D</title>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#050403;color:#e8d19a;
}
body{display:flex;align-items:center;justify-content:center}
#app{width:100vmin;height:100vmin;position:relative}
canvas{position:absolute;width:100%;height:100%;inset:0}
#ui{position:fixed;top:16px;left:0;width:100%;
 text-align:center;font:12px Arial;letter-spacing:4px;
 color:#c6a766;pointer-events:none}
#info{position:fixed;bottom:15px;width:100%;
 text-align:center;color:#bca16a;font:11px Arial}
</style>
</head>
<body>
<div id="app">
 <canvas id="gl"></canvas>
 <canvas id="overlay"></canvas>
</div>
<div id="ui">羅經八卦 · LA KINH BÁT QUÁI</div>
<div id="info">WEBGL · AUTO ZOOM · 40,000 LINES</div>

<script>
"use strict";

const canvas=document.getElementById("gl");
const overlay=document.getElementById("overlay");
const ctx=overlay.getContext("2d");
const gl=canvas.getContext("webgl",{
 alpha:false,antialias:true,powerPreference:"high-performance"
});

if(!gl){
 document.getElementById("info").textContent="Thiết bị không hỗ trợ WebGL";
 throw new Error("WebGL unavailable");
}

const vs=`
attribute float aAngle;
attribute float aRadius;
attribute float aLength;
attribute float aSide;
attribute float aPhase;
attribute float aType;

uniform float uTime;
uniform float uAspect;
uniform float uZoom;
uniform float uTilt;

varying float vAlpha;
varying float vType;

void main(){
 float a=aAngle+uTime*(0.025+0.055*(1.0-aRadius));
 float pulse=sin(uTime*1.4+aPhase)*0.003;
 float r=aRadius+pulse;

 // Chuyển động phối cảnh theo chiều sâu
 float depth=1.0+uTilt*sin(a+uTime*0.35)*0.10;
 float rr=(r+aSide*aLength*0.5)*depth;

 vec2 p=vec2(cos(a)*rr,sin(a)*rr);
 p.y*=0.90+0.10*cos(a+uTime*0.2);
 p.x/=uAspect;
 p*=uZoom;

 gl_Position=vec4(p,0.0,1.0);
 gl_PointSize=1.0;
 vAlpha=0.48+0.52*(0.5+0.5*sin(uTime*1.8+aPhase));
 vType=aType;
}`;

const fs=`
precision mediump float;
varying float vAlpha;
varying float vType;
void main(){
 vec3 gold=vec3(0.78,0.64,0.36);
 vec3 light=vec3(1.0,0.88,0.59);
 vec3 col=mix(gold,light,0.25+0.25*sin(vType*6.283));
 gl_FragColor=vec4(col,vAlpha);
}`;

function shader(type,source){
 const s=gl.createShader(type);
 gl.shaderSource(s,source);
 gl.compileShader(s);
 if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))
  throw Error(gl.getShaderInfoLog(s));
 return s;
}

const program=gl.createProgram();
gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));
gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(program);
if(!gl.getProgramParameter(program,gl.LINK_STATUS))
 throw Error(gl.getProgramInfoLog(program));
gl.useProgram(program);

const loc={};
[
 "aAngle","aRadius","aLength","aSide","aPhase","aType",
 "uTime","uAspect","uZoom","uTilt"
].forEach(n=>{
 loc[n]=n.startsWith("u")
 ?gl.getUniformLocation(program,n)
 :gl.getAttribLocation(program,n);
});

const numLines=40000;
const stride=6;
const vertices=new Float32Array(numLines*2*stride);
let seed=721038;
function rand(){
 seed=(seed*1664525+1013904223)>>>0;
 return seed/4294967296;
}

for(let i=0;i<numLines;i++){
 const angle=rand()*Math.PI*2;
 const radius=0.12+Math.sqrt(rand())*0.82;
 const length=0.002+rand()*0.012;
 const phase=rand()*Math.PI*2;
 const type=rand();
 for(let j=0;j<2;j++){
  const k=(i*2+j)*stride;
  vertices[k]=angle;
  vertices[k+1]=radius;
  vertices[k+2]=length;
  vertices[k+3]=j===0?-1:1;
  vertices[k+4]=phase;
  vertices[k+5]=type;
 }
}

const buffer=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
gl.bufferData(gl.ARRAY_BUFFER,vertices,gl.STATIC_DRAW);

[
 ["aAngle",0],["aRadius",1],["aLength",2],
 ["aSide",3],["aPhase",4],["aType",5]
].forEach(([name,index])=>{
 gl.enableVertexAttribArray(loc[name]);
 gl.vertexAttribPointer(loc[name],1,gl.FLOAT,false,stride*4,index*4);
});

gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
gl.clearColor(0.018,0.014,0.009,1);

function resize(){
 const dpr=Math.min(devicePixelRatio||1,2);
 const r=canvas.getBoundingClientRect();
 const w=Math.max(1,Math.round(r.width*dpr));
 const h=Math.max(1,Math.round(r.height*dpr));
 if(canvas.width!==w||canvas.height!==h){
  canvas.width=overlay.width=w;
  canvas.height=overlay.height=h;
 }
 gl.viewport(0,0,w,h);
}

function circle(r,color,width=1){
 ctx.beginPath();
 ctx.arc(0,0,r,0,Math.PI*2);
 ctx.strokeStyle=color;
 ctx.lineWidth=width;
 ctx.stroke();
}

function label(txt,r,a,size,color){
 ctx.save();
 ctx.rotate(a);
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.font="bold "+size+"px serif";
 ctx.fillStyle=color;
 ctx.fillText(txt,0,-r);
 ctx.restore();
}

const gua=[
 ["坎","☵"],["艮","☶"],["震","☳"],["巽","☴"],
 ["離","☲"],["坤","☷"],["兌","☱"],["乾","☰"]
];
const dirs=["北","東北","東","東南","南","西南","西","西北"];
const mountains=[
 "子","癸","丑","艮","寅","甲","卯","乙",
 "辰","巽","巳","丙","午","丁","未","坤",
 "申","庚","酉","辛","戌","乾","亥","壬"
];

function drawOverlay(t,zoom){
 const w=overlay.width,h=overlay.height;
 const s=Math.min(w,h),R=s*0.46;
 ctx.setTransform(1,0,0,1,0,0);
 ctx.clearRect(0,0,w,h);
 ctx.save();
 ctx.translate(w/2,h/2);
 ctx.scale(zoom,zoom);

 // Toàn bộ vòng la bàn phóng to thu nhỏ đồng bộ
 for(let i=0;i<15;i++){
  const r=R*(0.12+i*0.0615);
  circle(r,i%2?"#80653a":"#c6a15a",i===14?2:1);
 }

 // 360 độ vạch chia
 for(let i=0;i<360;i++){
  const a=i*Math.PI/180;
  const major=i%15===0,medium=i%5===0;
  const r1=R*(major?.87:medium?.91:.94);
  const r2=R*.98;
  ctx.beginPath();
  ctx.moveTo(Math.sin(a)*r1,-Math.cos(a)*r1);
  ctx.lineTo(Math.sin(a)*r2,-Math.cos(a)*r2);
  ctx.strokeStyle=major?"#f0d18b":"#76603b";
  ctx.lineWidth=major?1.3:.5;
  ctx.stroke();
 }

 // 24 sơn hướng
 for(let i=0;i<24;i++){
  label(mountains[i],R*.79,i*Math.PI/12,
   Math.max(8,R*.032),"#e0c58a");
 }

 // Tám quẻ
 for(let i=0;i<8;i++){
  const a=i*Math.PI/4;
  label(gua[i][0],R*.66,a,Math.max(15,R*.075),"#f4d994");
  label(gua[i][1],R*.50,a,Math.max(13,R*.064),"#e2c37e");
  label(dirs[i],R*.88,a,Math.max(8,R*.033),
   i===0?"#ff6247":"#c7b17d");
 }

 // Vòng 64 ký hiệu
 const signs=["乾","坤","震","巽","坎","離","艮","兌",
 "天","地","雷","風","水","火","山","澤"];
 for(let i=0;i<64;i++){
  label(signs[i%16],R*.36,i*Math.PI/32,
   Math.max(7,R*.025),i%4===0?"#e8ca83":"#a88b56");
 }

 // Thái cực tự xoay
 ctx.save();
 ctx.rotate(t*.18);
 const rr=R*.115;
 ctx.beginPath();
 ctx.arc(0,0,rr,0,Math.PI*2);
 ctx.fillStyle="#e2cc94";
 ctx.fill();

 ctx.beginPath();
 ctx.arc(0,0,rr*.96,-Math.PI/2,Math.PI/2);
 ctx.fillStyle="#17120b";
 ctx.fill();

 ctx.beginPath();
 ctx.arc(0,-rr*.48,rr*.48,0,Math.PI*2);
 ctx.fillStyle="#e2cc94";
 ctx.fill();

 ctx.beginPath();
 ctx.arc(0,rr*.48,rr*.48,0,Math.PI*2);
 ctx.fillStyle="#17120b";
 ctx.fill();

 ctx.beginPath();
 ctx.arc(0,-rr*.48,rr*.10,0,Math.PI*2);
 ctx.fillStyle="#17120b";
 ctx.fill();

 ctx.beginPath();
 ctx.arc(0,rr*.48,rr*.10,0,Math.PI*2);
 ctx.fillStyle="#e2cc94";
 ctx.fill();
 ctx.restore();

 // Mũi Bắc
 ctx.beginPath();
 ctx.moveTo(0,-R*.99);
 ctx.lineTo(-R*.018,-R*.91);
 ctx.lineTo(0,-R*.94);
 ctx.lineTo(R*.018,-R*.91);
 ctx.closePath();
 ctx.fillStyle="#e34531";
 ctx.fill();

 ctx.restore();
}

const start=performance.now();
let last=0;

function frame(now){
 requestAnimationFrame(frame);
 if(now-last<24)return;
 last=now;
 resize();

 const t=(now-start)/1000;

 // Zoom tuần hoàn: nhỏ -> lớn -> nhỏ
 const zoom=0.73+0.27*(0.5+0.5*Math.sin(t*0.9));

 // Phối cảnh dao động
 const tilt=0.20+0.16*Math.sin(t*0.55);

 gl.clear(gl.COLOR_BUFFER_BIT);
 gl.uniform1f(loc.uTime,t);
 gl.uniform1f(loc.uAspect,canvas.width/canvas.height);
 gl.uniform1f(loc.uZoom,zoom);
 gl.uniform1f(loc.uTilt,tilt);

 gl.drawArrays(gl.LINES,0,numLines*2);
 drawOverlay(t,zoom);
}

window.addEventListener("resize",resize);

// Tự khởi chạy khi mở trang
requestAnimationFrame(frame);
</script>
</body>
</html>
