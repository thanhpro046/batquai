<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101114">
<title>La Kinh Bát Quái 3D</title>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#101114;color:#eee
}
body{display:flex;align-items:center;justify-content:center}
#app{
 width:min(100vw,100vh);height:min(100vw,100vh);
 position:relative;overflow:hidden
}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#title{
 position:fixed;top:12px;width:100%;text-align:center;
 font:10px Arial;letter-spacing:3px;color:#bfc2cb;
 pointer-events:none
}
#info{
 position:fixed;bottom:10px;width:100%;text-align:center;
 font:9px Arial;letter-spacing:2px;color:#777b85;
 pointer-events:none
}
</style>
</head>
<body>
<div id="app">
 <canvas id="gl"></canvas>
 <canvas id="overlay"></canvas>
</div>
<div id="title">羅經八卦 · LA KINH BÁT QUÁI</div>
<div id="info">CELESTIAL COMPASS · WEBGL</div>

<script>
"use strict";

const canvas=document.getElementById("gl");
const overlay=document.getElementById("overlay");
const ctx=overlay.getContext("2d");

const gl=canvas.getContext("webgl",{
 alpha:false,antialias:true,powerPreference:"high-performance"
});

if(!gl){
 document.getElementById("info").textContent="WebGL không được hỗ trợ";
 throw Error("WebGL unavailable");
}

const vs=`
attribute float aAngle;
attribute float aRadius;
attribute float aLength;
attribute float aSide;
attribute float aPhase;
attribute float aType;

uniform float uTime;
uniform float uAspect;
uniform float uZoom;

varying float vAlpha;
varying float vType;

void main(){
 float a=aAngle+uTime*(0.012+0.035*(1.0-aRadius));
 float r=aRadius+sin(uTime*1.3+aPhase)*0.002;

 float rr=r+aSide*aLength*0.5;
 vec2 p=vec2(cos(a)*rr,sin(a)*rr);

 p.y*=0.96+0.04*cos(a+uTime*0.2);
 p.x/=uAspect;
 p*=uZoom;

 gl_Position=vec4(p,0.0,1.0);
 gl_PointSize=1.0;

 vAlpha=0.08+0.5*(0.5+0.5*sin(uTime+aPhase));
 vType=aType;
}`;

const fs=`
precision mediump float;
varying float vAlpha;
varying float vType;

void main(){
 vec3 col=mix(
  vec3(0.53,0.55,0.60),
  vec3(0.98,0.98,1.0),
  0.3+0.3*sin(vType*6.283)
 );
 gl_FragColor=vec4(col,vAlpha);
}`;

function makeShader(type,src){
 const s=gl.createShader(type);
 gl.shaderSource(s,src);
 gl.compileShader(s);
 if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))
  throw Error(gl.getShaderInfoLog(s));
 return s;
}

const program=gl.createProgram();
gl.attachShader(program,makeShader(gl.VERTEX_SHADER,vs));
gl.attachShader(program,makeShader(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(program);

if(!gl.getProgramParameter(program,gl.LINK_STATUS))
 throw Error(gl.getProgramInfoLog(program));

gl.useProgram(program);

const loc={};
[
 "aAngle","aRadius","aLength","aSide","aPhase","aType",
 "uTime","uAspect","uZoom"
].forEach(n=>{
 loc[n]=n.startsWith("u")
  ?gl.getUniformLocation(program,n)
  :gl.getAttribLocation(program,n);
});

// Hạt và vệt sáng nền
const count=18000,stride=6;
const data=new Float32Array(count*2*stride);
let seed=721038;

function random(){
 seed=(seed*1664525+1013904223)>>>0;
 return seed/4294967296;
}

for(let i=0;i<count;i++){
 const a=random()*Math.PI*2;
 const r=.08+Math.sqrt(random())*.92;
 const len=.001+random()*.009;
 const phase=random()*Math.PI*2;
 const type=random();

 for(let j=0;j<2;j++){
  const k=(i*2+j)*stride;
  data[k]=a;
  data[k+1]=r;
  data[k+2]=len;
  data[k+3]=j===0?-1:1;
  data[k+4]=phase;
  data[k+5]=type;
 }
}

const buffer=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);

[
 ["aAngle",0],["aRadius",1],["aLength",2],
 ["aSide",3],["aPhase",4],["aType",5]
].forEach(([name,index])=>{
 gl.enableVertexAttribArray(loc[name]);
 gl.vertexAttribPointer(
  loc[name],1,gl.FLOAT,false,stride*4,index*4
 );
});

gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
gl.clearColor(.055,.057,.064,1);

function resize(){
 const dpr=Math.min(devicePixelRatio||1,1.5);
 const r=canvas.getBoundingClientRect();
 const w=Math.max(1,Math.round(r.width*dpr));
 const h=Math.max(1,Math.round(r.height*dpr));

 if(canvas.width!==w||canvas.height!==h){
  canvas.width=w;
  canvas.height=h;
  overlay.width=w;
  overlay.height=h;
 }
 gl.viewport(0,0,w,h);
}

function circle(r,color,width=1){
 ctx.beginPath();
 ctx.arc(0,0,r,0,Math.PI*2);
 ctx.strokeStyle=color;
 ctx.lineWidth=width;
 ctx.stroke();
}

function textAt(txt,r,a,size,color){
 ctx.save();
 ctx.rotate(a);
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.font="bold "+size+"px serif";
 ctx.fillStyle=color;
 ctx.fillText(txt,0,-r);
 ctx.restore();
}

const gua=[
 ["坎","☵"],["艮","☶"],["震","☳"],["巽","☴"],
 ["離","☲"],["坤","☷"],["兌","☱"],["乾","☰"]
];

const directions=["北","東北","東","東南","南","西南","西","西北"];

const mountains=[
 "子","癸","丑","艮","寅","甲","卯","乙",
 "辰","巽","巳","丙","午","丁","未","坤",
 "申","庚","酉","辛","戌","乾","亥","壬"
];

const stems=[
 "甲","乙","丙","丁","戊","己","庚","辛","壬","癸",
 "子","丑","寅","卯","辰","巳","午","未","申","酉",
 "戌","亥"
];

function drawCompass(t,zoom){
 const w=overlay.width,h=overlay.height;
 const s=Math.min(w,h),R=s*.445;

 ctx.setTransform(1,0,0,1,0,0);
 ctx.clearRect(0,0,w,h);
 ctx.save();

 ctx.translate(w/2,h/2);

 // Zoom toàn bộ la kinh, bao gồm Thái Cực và chữ
 ctx.scale(zoom,zoom);

 // Các vòng xoay lệch tốc độ nhau
 ctx.save();
 ctx.rotate(t*.025);
 for(let i=0;i<25;i++){
  const r=R*(.08+i*.036);
  circle(
   r,
   i%3===0?"rgba(220,223,232,.65)":"rgba(153,159,173,.38)",
   i%3===0?1:.55
  );
 }
 ctx.restore();

 // Vạch chia 360 độ
 for(let i=0;i<360;i++){
  const a=i*Math.PI/180;
  const major=i%15===0;
  const medium=i%5===0;
  const r1=R*(major?.86:medium?.91:.955);
  const r2=R*.995;

  ctx.beginPath();
  ctx.moveTo(Math.sin(a)*r1,-Math.cos(a)*r1);
  ctx.lineTo(Math.sin(a)*r2,-Math.cos(a)*r2);

  ctx.strokeStyle=major
   ?"rgba(245,246,250,.9)"
   :medium
    ?"rgba(200,204,216,.65)"
    :"rgba(140,145,158,.36)";

  ctx.lineWidth=major?1:.45;
  ctx.stroke();
 }

 // Vòng 24 sơn hướng
 ctx.save();
 ctx.rotate(-t*.018);
 for(let i=0;i<24;i++){
  textAt(
   mountains[i],R*.90,i*Math.PI/12,
   Math.max(7,R*.024),"#e1e2e8"
  );
 }
 ctx.restore();

 // Các vòng ký hiệu nhỏ
 ctx.save();
 ctx.rotate(t*.012);

 for(let i=0;i<96;i++){
  const a=i*Math.PI/48;
  textAt(
   stems[(i*7)%stems.length],
   R*.785,a,Math.max(5,R*.014),
   i%4===0?"#e4e5eb":"#a5a9b5"
  );
 }

 for(let i=0;i<64;i++){
  const a=i*Math.PI/32;
  textAt(
   stems[(i*5+3)%stems.length],
   R*.69,a,Math.max(5,R*.013),"#b9bdc8"
  );
 }
 ctx.restore();

 // Bát quái lớn
 for(let i=0;i<8;i++){
  const a=i*Math.PI/4;

  textAt(
   gua[i][1],R*.43,a,
   Math.max(18,R*.073),"#f7f7fa"
  );

  textAt(
   gua[i][0],R*.60,a,
   Math.max(11,R*.037),"#e8e9ef"
  );

  textAt(
   directions[i],R*.72,a,
   Math.max(7,R*.021),"#d0d2db"
  );
 }

 // Vòng bát quái bên trong
 for(let i=0;i<8;i++){
  const a=i*Math.PI/4+Math.PI/8;
  const r=R*.32;

  ctx.save();
  ctx.rotate(a);
  ctx.strokeStyle="rgba(220,224,234,.55)";
  ctx.lineWidth=.8;
  ctx.beginPath();
  ctx.moveTo(-R*.04,-r);
  ctx.lineTo(R*.04,-r);
  ctx.stroke();
  ctx.restore();

  textAt(
   gua[(i+4)%8][1],R*.28,a,
   Math.max(9,R*.035),"#e0e2e9"
  );
 }

 // Thái Cực xoay độc lập
 ctx.save();
 ctx.rotate(-t*.20);

 const rr=R*.115;

 ctx.beginPath();
 ctx.arc(0,0,rr,0,Math.PI*2);
 ctx.fillStyle="#f2f2f5";
 ctx.fill();

 ctx.beginPath();
 ctx.arc(0,0,rr,Math.PI/2,-Math.PI/2);
 ctx.fillStyle="#101114";
 ctx.fill();

 ctx.beginPath();
 ctx.arc(0,-rr*.5,rr*.5,0,Math.PI*2);
 ctx.fillStyle="#101114";
 ctx.fill();

 ctx.beginPath();
 ctx.arc(0,rr*.5,rr*.5,0,Math.PI*2);
 ctx.fillStyle="#f2f2f5";
 ctx.fill();

 ctx.beginPath();
 ctx.arc(0,-rr*.5,rr*.105,0,Math.PI*2);
 ctx.fillStyle="#f2f2f5";
 ctx.fill();

 ctx.beginPath();
 ctx.arc(0,rr*.5,rr*.105,0,Math.PI*2);
 ctx.fillStyle="#101114";
 ctx.fill();

 ctx.restore();

 // Kim chỉ hướng
 ctx.beginPath();
 ctx.moveTo(0,-R*1.01);
 ctx.lineTo(-R*.012,-R*.96);
 ctx.lineTo(0,-R*.98);
 ctx.lineTo(R*.012,-R*.96);
 ctx.closePath();
 ctx.fillStyle="#f4f4f7";
 ctx.fill();

 ctx.restore();
}

// Đường quỹ đạo đan chéo, xuất hiện theo từng đoạn
function drawOrbits(t,zoom){
 const w=overlay.width,h=overlay.height;
 const s=Math.min(w,h);
 const phase=(t%18)/18;

 ctx.save();
 ctx.translate(w/2,h/2);
 ctx.scale(zoom,zoom);
 ctx.lineWidth=.65;

 const intensity=Math.max(0,Math.sin(phase*Math.PI*2));

 if(phase>.50&&phase<.85){
  for(let i=0;i<7;i++){
   ctx.save();
   ctx.rotate(t*.16+i*Math.PI/7);
   ctx.beginPath();
   ctx.ellipse(
    0,0,s*(.20+i*.025),s*(.07+i*.008),
    0,0,Math.PI*2
   );
   ctx.strokeStyle="rgba(210,215,230,"+
    (.13+.15*intensity)+")";
   ctx.stroke();
   ctx.restore();
  }
 }
 ctx.restore();
}

// Zoom theo chu kỳ: rất gần -> toàn cảnh -> rất gần
function smooth(v){
 v=Math.max(0,Math.min(1,v));
 return v*v*(3-2*v);
}

function zoomCurve(t){
 const cycle=(t%18.7)/18.7;

 // Các đoạn zoom sâu theo nhịp video
 const stops=[
  [0.00,2.45],
  [0.15,2.15],
  [0.29,0.66],
  [0.49,0.48],
  [0.65,0.58],
  [0.76,2.30],
  [0.84,2.60],
  [0.94,0.67],
  [1.00,0.48]
 ];

 let i=0;
 while(i<stops.length-2&&cycle>stops[i+1][0])i++;

 const a=stops[i],b=stops[i+1];
 const p=smooth((cycle-a[0])/(b[0]-a[0]));
 return a[1]+(b[1]-a[1])*p;
}

const start=performance.now();
let last=0,lastSize="";

function frame(now){
 requestAnimationFrame(frame);

 if(now-last<16)return;
 last=now;

 const r=canvas.getBoundingClientRect();
 const key=Math.round(r.width)+"x"+Math.round(r.height)+
  "@"+Math.min(devicePixelRatio||1,1.5);

 resize();
 if(key!==lastSize)lastSize=key;

 const t=(now-start)/1000;
 const zoom=zoomCurve(t);

 gl.clear(gl.COLOR_BUFFER_BIT);
 gl.uniform1f(loc.uTime,t);
 gl.uniform1f(loc.uAspect,canvas.width/canvas.height);
 gl.uniform1f(loc.uZoom,zoom);
 gl.drawArrays(gl.LINES,0,count*2);

 drawCompass(t,zoom);
 drawOrbits(t,zoom);
}

window.addEventListener("resize",resize);
requestAnimationFrame(frame);
</script>
</body>
</html>
